apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-service
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80        # Port on the Service (inside the cluster)
      targetPort: 80  # Port on the Pod (container)
      nodePort: 30007 # Static port exposed on each Node
