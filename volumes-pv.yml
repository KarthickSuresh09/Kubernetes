apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv             # Name of the PV
spec:
  capacity:
    storage: 1Gi          # Total storage capacity (1 GiB)
  accessModes:
    - ReadWriteOnce       # Only one node can mount it as read-write
  hostPath:
    path: "/mnt/data"     # The path on the host node where data will be stored
